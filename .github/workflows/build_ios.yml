name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build iOS Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create empty .env if missing
        run: |
          if [ ! -f .env ]; then
            touch .env
          fi
        shell: bash

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Application (Release, No CodeSign)
        run: flutter build ios --release --no-codesign

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r yahp_director.ipa Payload
        shell: bash

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yahp_director-ios-ipa
          path: yahp_director.ipa
          retention-days: 7